name: Frontend publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish
        required: false
        default: main
        type: string

env:
  AWS_REGION: us-east-1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  id-token: write
  contents: read

jobs:
  authorize:
    name: Authorize manual trigger
    runs-on: ubuntu-latest
    steps:
      - name: Fail if actor is not allowed
        if: ${{ github.actor != 'poltorres7' }}
        run: |
          echo "This workflow can only be executed manually by poltorres7."
          echo "Triggered by: ${{ github.actor }}"
          exit 1

      - name: Confirm allowed actor
        run: |
          echo "Authorized actor: ${{ github.actor }}"

  publish:
    name: Build and publish frontend
    needs: authorize
    runs-on: ubuntu-latest
    env:
      SELECTED_REF: ${{ github.event.inputs.ref || 'main' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.SELECTED_REF }}

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: arn:aws:iam::401202591305:role/oidc-github-mxintech-website-role
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 900

      - name: Resolve deployment targets from stack outputs
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          frontend_bucket=$(aws cloudformation describe-stacks \
            --stack-name mxintech-website \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue | [0]" \
            --output text)

          distribution_id=$(aws cloudformation describe-stacks \
            --stack-name mxintech-website \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue | [0]" \
            --output text)

          api_public_url=$(aws cloudformation describe-stacks \
            --stack-name mxintech-contact-api \
            --query "Stacks[0].Outputs[?OutputKey=='ApiPublicUrl'].OutputValue | [0]" \
            --output text 2>/dev/null || true)

          if [[ -z "$api_public_url" || "$api_public_url" == "None" ]]; then
            api_public_url=$(aws cloudformation describe-stacks \
              --stack-name mxintech-contact-api \
              --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue | [0]" \
              --output text 2>/dev/null || true)
          fi

          for pair in \
            "frontend_bucket:$frontend_bucket" \
            "distribution_id:$distribution_id" \
            "api_public_url:$api_public_url"
          do
            key="${pair%%:*}"
            value="${pair#*:}"
            if [[ -z "$value" || "$value" == "None" ]]; then
              echo "Unable to resolve required value: $key"
              if [[ "$key" == "api_public_url" ]]; then
                echo "Deploy mxintech-contact-api first (AWS deploy → contact-api), then re-run frontend publish."
              fi
              exit 1
            fi
          done

          turnstile_secret_json=$(aws secretsmanager get-secret-value \
            --secret-id mxintech-website/cloudflare-widget/turnstile \
            --query 'SecretString' \
            --output text)
          turnstile_site_key=$(python3 -c "import json,sys; print(json.load(sys.stdin)['SITE_KEY'])" <<< "$turnstile_secret_json")
          if [[ -z "$turnstile_site_key" ]]; then
            echo "Turnstile SITE_KEY is empty in mxintech-website/cloudflare-widget/turnstile"
            exit 1
          fi

          echo "frontend_bucket=$frontend_bucket" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$distribution_id" >> "$GITHUB_OUTPUT"
          echo "api_public_url=$api_public_url" >> "$GITHUB_OUTPUT"
          echo "turnstile_site_key=$turnstile_site_key" >> "$GITHUB_OUTPUT"

          echo "Resolved frontend bucket: $frontend_bucket"
          echo "Resolved distribution id: $distribution_id"
          echo "Resolved API public URL: $api_public_url"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          REACT_APP_API_ENDPOINT: ${{ steps.resolve.outputs.api_public_url }}
          REACT_APP_TURNSTILE_SITE_KEY: ${{ steps.resolve.outputs.turnstile_site_key }}
        run: npm run build

      - name: Confirm frontend bucket exists
        run: aws s3api head-bucket --bucket "${{ steps.resolve.outputs.frontend_bucket }}"

      - name: Upload static assets
        run: |
          aws s3 sync build/ "s3://${{ steps.resolve.outputs.frontend_bucket }}" \
            --delete \
            --exact-timestamps \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "asset-manifest.json" \
            --exclude "sitemap.xml" \
            --exclude "robots.txt"

      - name: Upload entry files with short cache
        run: |
          aws s3 cp build/index.html "s3://${{ steps.resolve.outputs.frontend_bucket }}/index.html" \
            --cache-control "public, max-age=0, must-revalidate"
          aws s3 cp build/asset-manifest.json "s3://${{ steps.resolve.outputs.frontend_bucket }}/asset-manifest.json" \
            --cache-control "public, max-age=0, must-revalidate"
          aws s3 cp build/sitemap.xml "s3://${{ steps.resolve.outputs.frontend_bucket }}/sitemap.xml" \
            --cache-control "public, max-age=3600"
          aws s3 cp build/robots.txt "s3://${{ steps.resolve.outputs.frontend_bucket }}/robots.txt" \
            --cache-control "public, max-age=3600"

      - name: Invalidate CloudFront cache
        id: invalidate
        shell: bash
        run: |
          set -euo pipefail
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.resolve.outputs.distribution_id }}" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)
          echo "invalidation_id=$invalidation_id" >> "$GITHUB_OUTPUT"

      - name: Wait for CloudFront invalidation completion
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ steps.resolve.outputs.distribution_id }}" \
            --id "${{ steps.invalidate.outputs.invalidation_id }}"

      - name: Publish summary
        run: |
          echo "Bucket: ${{ steps.resolve.outputs.frontend_bucket }}"
          echo "Distribution: ${{ steps.resolve.outputs.distribution_id }}"
          echo "Invalidation: ${{ steps.invalidate.outputs.invalidation_id }}"
          echo "API base URL injected into build: ${{ steps.resolve.outputs.api_public_url }}"
