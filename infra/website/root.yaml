AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Hosts the Mxintech marketing SPA on private S3 behind CloudFront with OAC,
  access logging, security headers, and Route53 alias records.

Parameters:
  SiteBucketName:
    Type: String
    Default: mxintech.org
  LoggingBucketName:
    Type: String
    Default: mxintech-site-logs
  RootDomainName:
    Type: String
    Default: mxintech.org
  AllowedOrigin:
    Type: String
    Default: https://mxintech.org
    Description: Browser origin allowed for S3 CORS (CloudFront serves the site).
  CertificateArn:
    Type: String
    Description: ACM certificate ARN in us-east-1 covering the site domain.
    Default: arn:aws:acm:us-east-1:401202591305:certificate/3b434445-b0a5-456c-be8f-5f5c4727d963
  HostedZoneId:
    Type: String
    Description: Route53 hosted zone for the apex domain.
    Default: Z08260591V5SBJARZB4I0
  PriceClass:
    Type: String
    Default: PriceClass_All
    AllowedValues:
      - PriceClass_All
      - PriceClass_200
      - PriceClass_100
  ManageDnsRecords:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Set true only when Route53 alias records should be owned by this stack.

Conditions:
  ShouldManageDnsRecords: !Equals [!Ref ManageDnsRecords, 'true']

Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref SiteBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: s3-access-logs
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - !Ref AllowedOrigin
              - !Sub 'https://www.${RootDomainName}'
            MaxAge: 3600

  LoggingBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Ref LoggingBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      AccessControl: LogDeliveryWrite
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  BucketPolicyForLogging:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LoggingBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PolicyForS3ServerLog
            Effect: Allow
            Resource: !Sub '${LoggingBucket.Arn}/*'
            Principal:
              Service: logging.s3.amazonaws.com
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
            Action: s3:PutObject

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    DependsOn:
      - S3Bucket
    Properties:
      OriginAccessControlConfig:
        Description: OAC for the Mxintech website bucket
        Name: !Ref AWS::StackName
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendSecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        Comment: Security headers for mxintech.org
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true

  CFDistributionMXINTECH:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - DomainName: !GetAtt S3Bucket.RegionalDomainName
            Id: myS3Origin
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
        Enabled: true
        Aliases:
          - !Ref RootDomainName
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          TargetOriginId: myS3Origin
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
          ResponseHeadersPolicyId: !Ref FrontendSecurityHeadersPolicy
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        PriceClass: !Ref PriceClass
        Logging:
          Bucket: !GetAtt LoggingBucket.RegionalDomainName
          Prefix: cf-mxintech-access-logs
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PolicyForCloudFrontPrivateContent
            Effect: Allow
            Resource: !Sub '${S3Bucket.Arn}/*'
            Principal:
              Service: cloudfront.amazonaws.com
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CFDistributionMXINTECH}'
            Action: s3:GetObject

  FrontendAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: ShouldManageDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref RootDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CFDistributionMXINTECH.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  FrontendAliasRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: ShouldManageDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref RootDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CFDistributionMXINTECH.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  FrontendBucketName:
    Description: S3 bucket hosting the static site
    Value: !Ref S3Bucket
    Export:
      Name: !Sub '${AWS::StackName}-FrontendBucketName'
  FrontendDistributionId:
    Description: CloudFront distribution ID for the website
    Value: !Ref CFDistributionMXINTECH
    Export:
      Name: !Sub '${AWS::StackName}-FrontendDistributionId'
  FrontendDistributionArn:
    Description: CloudFront distribution ARN
    Value: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CFDistributionMXINTECH}'
    Export:
      Name: !Sub '${AWS::StackName}-FrontendDistributionArn'
  FrontendDomainName:
    Description: Public website domain
    Value: !Ref RootDomainName
  FrontendCloudFrontDomainName:
    Description: CloudFront domain name
    Value: !GetAtt CFDistributionMXINTECH.DomainName
