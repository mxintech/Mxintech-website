        - ProjectName: !Ref ProjectName
          FrontendCfId: !Ref FrontendCloudFrontDistributionId
          ApiCfId: !Ref ApiCloudFrontDistribution
          LogGroup: !Sub '/aws/lambda/${ProjectName}-contact-form-handler'

Outputs:
  ApiEndpoint:
    Description: Direct API Gateway endpoint (prefer CloudFront domain in production)
    Value: !Sub 'https://${ContactFormApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  ApiPublicUrl:
    Description: Public contact API base URL
    Value: !Sub 'https://${ApiDomainName}'
  ApiCloudFrontDomainName:
    Value: !GetAtt ApiCloudFrontDistribution.DomainName
  ApiCloudFrontDistributionId:
    Value: !Ref ApiCloudFrontDistribution
  DynamoDBTableName:
    Value: !Ref ContactSubmissionsTable
  VerificationTokensTableName:
    Value: !Ref ContactVerificationTokensTable
  LambdaFunctionArn:
    Value: !GetAtt ContactFormHandler.Arn
  OperationsDashboardName:
    Value: !Sub '${ProjectName}-operations'
  OperationsDashboardUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${ProjectName}-operations'
  AlertNotificationTopicArn:
    Value: !Ref AlertNotificationTopic
  SesConfigurationSetName:
    Value: !Ref SesConfigurationSet
