AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Contact form API for mxintech.org with DynamoDB, SES, CloudFront, and Turnstile.

Parameters:
  ProjectName:
    Type: String
    Default: mxintech-website
  ApiDomainName:
    Type: String
    Default: api.mxintech.org
  RootDomainName:
    Type: String
    Default: mxintech.org
  HostedZoneId:
    Type: String
    Default: Z08260591V5SBJARZB4I0
  AllowedOrigin:
    Type: String
    Default: https://mxintech.org
  FrontendCloudFrontDomainName:
    Type: String
    Default: d1y746pm63k1dn.cloudfront.net
    Description: CloudFront domain serving the public website.
  SesIdentityArn:
    Type: String
    Default: arn:aws:ses:us-east-1:401202591305:identity/mxintech.org
    Description: Verified SES domain identity for outbound mail.
  SesSenderEmail:
    Type: String
    Default: noreply@mxintech.org
  NotificationEmail:
    Type: String
    Default: contacto@mxintech.org
    Description: Team inbox notified on each new submission.
  OriginVerifySecret:
    Type: String
    NoEcho: true
    Description: Shared secret injected by CloudFront as X-Origin-Verify.
  TurnstileSecretKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Cloudflare Turnstile secret key.
  ContactFormLambdaRoleArn:
    Type: String
    Default: arn:aws:iam::401202591305:role/mxintech-website-lambda-contract-form-role
    Description: Pre-created Lambda execution role. See docs/iam/README.md.
  AlertNotificationEmail:
    Type: String
    Default: contacto@mxintech.org
    Description: Email address subscribed to CloudWatch alarm notifications.
  FrontendCloudFrontDistributionId:
    Type: String
    Default: E3GWK6OJ2D9DKH
    Description: Website CloudFront distribution ID for the operations dashboard.
  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch log retention for contact API Lambdas.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertNotificationEmail, '']]

Resources:
  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref ApiDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref ApiDomainName
          HostedZoneId: !Ref HostedZoneId

  ContactSubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-contact-submissions'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusTimestampIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: project
          Value: !Ref ProjectName

  ContactVerificationTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-contact-verification-tokens'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: project
          Value: !Ref ProjectName

  ContactFormHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-contact-form-handler'
      Runtime: python3.12
      Handler: handler.lambda_handler
      CodeUri: src/
      Timeout: 30
      Role: !Ref ContactFormLambdaRoleArn
      Environment:
        Variables:
          TABLE_NAME: !Ref ContactSubmissionsTable
          TOKENS_TABLE_NAME: !Ref ContactVerificationTokensTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          ORIGIN_VERIFY_SECRET: !Ref OriginVerifySecret
          TURNSTILE_SECRET_KEY: !Ref TurnstileSecretKey
          SES_IDENTITY_ARN: !Ref SesIdentityArn
          SES_SENDER_EMAIL: !Ref SesSenderEmail
          NOTIFICATION_EMAIL: !Ref NotificationEmail
          REQUESTED_WITH_HEADER: MxintechWebsite
          FRONTEND_CLOUDFRONT_DOMAIN: !Ref FrontendCloudFrontDomainName
          SES_CONFIGURATION_SET: !Ref SesConfigurationSet
          MAX_OTP_REQUESTS_PER_EMAIL_PER_DAY: '5'

  ContactFormApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-contact-api'
      Description: Contact form API for mxintech.org
      EndpointConfiguration:
        Types:
          - REGIONAL

  ContactResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ContactFormApi
      ParentId: !GetAtt ContactFormApi.RootResourceId
      PathPart: contact

  ContactRequestResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ContactFormApi
      ParentId: !Ref ContactResource
      PathPart: request

  ContactVerifyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ContactFormApi
      ParentId: !Ref ContactResource
      PathPart: verify

  ContactOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ContactFormApi
      ResourceId: !Ref ContactResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Requested-With'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  ContactPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ContactFormApi
      ResourceId: !Ref ContactResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ContactFormHandler.Arn}/invocations'

  ContactRequestOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ContactFormApi
      ResourceId: !Ref ContactRequestResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Requested-With'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  ContactRequestPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ContactFormApi
      ResourceId: !Ref ContactRequestResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ContactFormHandler.Arn}/invocations'

  ContactVerifyOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ContactFormApi
      ResourceId: !Ref ContactVerifyResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Requested-With'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  ContactVerifyPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ContactFormApi
      ResourceId: !Ref ContactVerifyResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ContactFormHandler.Arn}/invocations'

  ContactFormLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ContactFormHandler
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ContactFormApi}/*/*'

  ContactFormApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ContactPostMethod
      - ContactOptionsMethod
      - ContactRequestPostMethod
      - ContactRequestOptionsMethod
      - ContactVerifyPostMethod
      - ContactVerifyOptionsMethod
    Properties:
      RestApiId: !Ref ContactFormApi
      StageName: prod
      Description: !Sub '${ProjectName} contact API including verification routes'

  ApiOriginGateFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${ProjectName}-contact-api-origin-gate'
      AutoPublish: true
      FunctionConfig:
        Comment: Block mutations without the allowed browser Origin at the edge.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          if (request.method === 'POST' || request.method === 'PUT' || request.method === 'PATCH' || request.method === 'DELETE') {
            var origin = request.headers.origin ? request.headers.origin.value : '';
            if (origin !== '${AllowedOrigin}') {
              return {
                statusCode: 403,
                statusDescription: 'Forbidden',
                headers: { 'content-type': { value: 'application/json' } },
                body: '{"message":"Origin not allowed"}'
              };
            }
          }
          return request;
        }

  ApiCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName} contact API'
        HttpVersion: http2
        IPV6Enabled: true
        Aliases:
          - !Ref ApiDomainName
        Origins:
          - Id: api-gateway-origin
            DomainName: !Sub '${ContactFormApi}.execute-api.${AWS::Region}.amazonaws.com'
            OriginPath: /prod
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
            OriginCustomHeaders:
              - HeaderName: X-Mxintech-Origin
                HeaderValue: !Ref FrontendCloudFrontDomainName
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginVerifySecret
        DefaultCacheBehavior:
          TargetOriginId: api-gateway-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ApiOriginGateFunction.FunctionMetadata.FunctionARN
        ViewerCertificate:
          AcmCertificateArn: !Ref ApiCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - Key: project
          Value: !Ref ProjectName

  ApiCloudFrontAliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiCloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  ApiCloudFrontAliasRecordIpv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt ApiCloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  ContactFormLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-contact-form-handler'
      RetentionInDays: !Ref LogRetentionDays

  SesFeedbackLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-ses-feedback'
      RetentionInDays: !Ref LogRetentionDays

  AlertNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-alerts'
      Tags:
        - Key: project
          Value: !Ref ProjectName

  AlertNotificationSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertNotificationTopic
      Protocol: email
      Endpoint: !Ref AlertNotificationEmail

  SesConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub '${ProjectName}-transactional'

  SesFeedbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-ses-feedback'
      Tags:
        - Key: project
          Value: !Ref ProjectName

  SesFeedbackTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref SesFeedbackTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountOwner
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - SNS:GetTopicAttributes
              - SNS:SetTopicAttributes
              - SNS:Subscribe
              - SNS:ListSubscriptionsByTopic
              - SNS:Publish
            Resource: !Ref SesFeedbackTopic
          - Sid: AllowSesPublish
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: SNS:Publish
            Resource: !Ref SesFeedbackTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  SesFeedbackEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref SesFeedbackTopic
      Protocol: email
      Endpoint: !Ref AlertNotificationEmail

  SesFeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-ses-feedback'
      Runtime: python3.12
      Handler: ses_feedback.handler
      CodeUri: src/
      Timeout: 30
      Role: !Ref ContactFormLambdaRoleArn
      Environment:
        Variables:
          TOKENS_TABLE_NAME: !Ref ContactVerificationTokensTable

  SesFeedbackTopicLambdaSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref SesFeedbackTopic
      Protocol: lambda
      Endpoint: !GetAtt SesFeedbackFunction.Arn

  SesFeedbackFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SesFeedbackFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref SesFeedbackTopic

  SesFeedbackEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref SesConfigurationSet
      EventDestination:
        Name: !Sub '${ProjectName}-ses-feedback-sns'
        Enabled: true
        MatchingEventTypes:
          - bounce
          - complaint
          - reject
        SnsDestination:
          TopicARN: !Ref SesFeedbackTopic

  ContactLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-contact-lambda-errors'
      AlarmDescription: Contact form Lambda reported function errors.
      AlarmActions:
        - !Ref AlertNotificationTopic
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ContactFormHandler
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ContactApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-contact-api-5xx'
      AlarmDescription: Contact API Gateway is returning server errors.
      AlarmActions:
        - !Ref AlertNotificationTopic
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub '${ProjectName}-contact-api'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ContactApiAbuseAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-contact-api-abuse'
      AlarmDescription: Sustained 4xx volume on the contact API suggests abuse or OTP spam.
      AlarmActions:
        - !Ref AlertNotificationTopic
      Namespace: AWS/ApiGateway
      MetricName: 4XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub '${ProjectName}-contact-api'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 120
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  EmailCapExhaustedMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: ContactFormLogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-contact-form-handler'
      FilterPattern: '{ $.contactEvent = "email_cap_exhausted" }'
      MetricTransformations:
        - MetricNamespace: MxintechWebsite
          MetricName: EmailCapExhausted
          MetricValue: '1'
          DefaultValue: 0

  OtpDailyLimitMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: ContactFormLogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-contact-form-handler'
      FilterPattern: '{ $.contactEvent = "otp_daily_limit_exceeded" }'
      MetricTransformations:
        - MetricNamespace: MxintechWebsite
          MetricName: OtpDailyLimitExceeded
          MetricValue: '1'
          DefaultValue: 0

  OtpRateLimitMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: ContactFormLogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-contact-form-handler'
      FilterPattern: '{ $.contactEvent = "otp_request_rate_limited" }'
      MetricTransformations:
        - MetricNamespace: MxintechWebsite
          MetricName: OtpRequestRateLimited
          MetricValue: '1'
          DefaultValue: 0

  DeliverabilityBlockedMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: ContactFormLogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-contact-form-handler'
      FilterPattern: '{ $.contactEvent = "deliverability_blocked" }'
      MetricTransformations:
        - MetricNamespace: MxintechWebsite
          MetricName: DeliverabilityBlocked
          MetricValue: '1'
          DefaultValue: 0

  VerifySucceededMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: ContactFormLogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-contact-form-handler'
      FilterPattern: '{ $.contactEvent = "verify_succeeded" }'
      MetricTransformations:
        - MetricNamespace: MxintechWebsite
          MetricName: ContactVerifySucceeded
          MetricValue: '1'
          DefaultValue: 0

  SesBouncePermanentMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: SesFeedbackLogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-ses-feedback'
      FilterPattern: '{ $.contactEvent = "ses_bounce_permanent" }'
      MetricTransformations:
        - MetricNamespace: MxintechWebsite
          MetricName: SesBouncePermanent
          MetricValue: '$.count'
          DefaultValue: 0

  SesComplaintMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: SesFeedbackLogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-ses-feedback'
      FilterPattern: '{ $.contactEvent = "ses_complaint" }'
      MetricTransformations:
        - MetricNamespace: MxintechWebsite
          MetricName: SesComplaint
          MetricValue: '$.count'
          DefaultValue: 0

  EmailCapExhaustedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-email-cap-exhausted'
      AlarmDescription: Daily outbound email budget exhausted — possible SES abuse.
      AlarmActions:
        - !Ref AlertNotificationTopic
      Namespace: MxintechWebsite
      MetricName: EmailCapExhausted
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  OtpAbuseAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-otp-abuse'
      AlarmDescription: Repeated OTP daily-limit blocks suggest 2FA code spam.
      AlarmActions:
        - !Ref AlertNotificationTopic
      Namespace: MxintechWebsite
      MetricName: OtpDailyLimitExceeded
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SesBounceRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-ses-bounce-rate'
      AlarmDescription: SES bounce rate above 5% — sender reputation at risk.
      AlarmActions:
        - !Ref AlertNotificationTopic
      Namespace: AWS/SES
      MetricName: Reputation.BounceRate
      Statistic: Average
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0.05
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SesComplaintRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-ses-complaint-rate'
      AlarmDescription: SES complaint rate above 0.1%.
      AlarmActions:
        - !Ref AlertNotificationTopic
      Namespace: AWS/SES
      MetricName: Reputation.ComplaintRate
      Statistic: Average
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0.001
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SesBounceVolumeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-ses-bounce-volume'
      AlarmDescription: More than 10 permanent bounces in 30 minutes.
      AlarmActions:
        - !Ref AlertNotificationTopic
      Namespace: MxintechWebsite
      MetricName: SesBouncePermanent
      Statistic: Sum
      Period: 1800
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ProjectName}-operations'
      DashboardBody: !Sub
        - |
          {"widgets":[{"type":"text","x":0,"y":0,"width":24,"height":2,"properties":{"markdown":"# México in Tech operations\nWebsite edge, contact API, Lambda health, OTP abuse signals, and SES reputation for **${ProjectName}**."}},{"type":"alarm","x":0,"y":2,"width":24,"height":4,"properties":{"title":"Active alarms","alarms":["arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ProjectName}-contact-lambda-errors","arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ProjectName}-contact-api-5xx","arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ProjectName}-contact-api-abuse","arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ProjectName}-email-cap-exhausted","arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ProjectName}-otp-abuse","arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ProjectName}-ses-bounce-rate","arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ProjectName}-ses-complaint-rate","arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ProjectName}-ses-bounce-volume"]}},{"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Contact API requests","view":"timeSeries","region":"${AWS::Region}","period":300,"stat":"Sum","metrics":[["AWS/ApiGateway","Count","ApiName","${ProjectName}-contact-api"],[".","4XXError",".","."],[".","5XXError",".","."]]}},{"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Contact Lambda","view":"timeSeries","region":"${AWS::Region}","period":300,"metrics":[["AWS/Lambda","Invocations","FunctionName","${ProjectName}-contact-form-handler",{"stat":"Sum","yAxis":"right"}],[".","Errors",".",".",{"stat":"Sum","color":"#d62728"}],[".","Duration",".",".",{"stat":"p99","yAxis":"left"}]]}},{"type":"metric","x":0,"y":12,"width":12,"height":6,"properties":{"title":"Website CloudFront","view":"timeSeries","region":"us-east-1","period":300,"stat":"Sum","metrics":[["AWS/CloudFront","Requests","DistributionId","${FrontendCfId}","Reg